name: Update CannaAnarchy Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Anarchy status snapshot
        env:
          SFTP_HOST: ${{ secrets.CANNAANARCHY_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.CANNAANARCHY_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.CANNAANARCHY_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.CANNAANARCHY_SFTP_PASSWORD }}
        run: |
          python -m pip install --quiet paramiko
          python <<'PY'
          import os
          import paramiko
          host = os.environ['SFTP_HOST']
          port = int(os.environ.get('SFTP_PORT') or '2022')
          transport = paramiko.Transport((host, port))
          transport.connect(username=os.environ['SFTP_USERNAME'], password=os.environ['SFTP_PASSWORD'])
          sftp = paramiko.SFTPClient.from_transport(transport)
          sftp.get('/plugins/CannaAnarchyStatus/server-status.json', 'anarchy/data/server-status.json')
          sftp.get('/plugins/CannaAnarchyStatus/server-status.json', 'api/status.json')
          sftp.close(); transport.close()
          PY
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- anarchy/data/server-status.json api/status.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anarchy/data/server-status.json api/status.json
          git commit -m "Update CannaAnarchy live status"
          git push
